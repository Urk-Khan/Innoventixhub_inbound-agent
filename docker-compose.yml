version: "3.8"

services:
  backend:
    build:
      context: ./Backend-main_IH
      dockerfile: Dockerfile
    container_name: innoventix_backend
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./Frontend-main_IH
      dockerfile: Dockerfile
    container_name: innoventix_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - backend
