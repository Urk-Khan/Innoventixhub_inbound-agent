version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: innoventix_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend-main_IH/innoventix_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend-main_IH
      dockerfile: Dockerfile
    container_name: innoventix_backend
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend-main_IH
      dockerfile: Dockerfile
    container_name: innoventix_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      - backend
      - postgres

volumes:
  postgres_data:
